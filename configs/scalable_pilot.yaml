experiment:
  name: scalable_pilot
  random_seed: 42

datasets:
  adult_income:
    enabled: true
  bank_marketing:
    enabled: true
  breast_cancer_wisconsin:
    enabled: true
  cic_ids2017:
    enabled: false
  covertype:
    enabled: true
  credit_card_fraud:
    enabled: true
  dry_bean:
    enabled: true
  higgs:
    enabled: false
  steel_plates_faults:
    enabled: true
  unsw_nb15:
    enabled: true

cross_validation:
  n_splits: 5
  shuffle: true

feature_selection:
  ranking_methods:
    - gain
    - weight
    - cover
    - shap

  feature_percentages:
    - 2.5
    - 5
    - 7.5
    - 10
    - 12.5
    - 15
    - 20
    - 25
    - 30

  random_repetitions: 20

ranking_xgboost:
  booster: gbtree
  objective: auto
  eval_metric: auto
  num_boost_round: 100
  max_depth: 8
  eta: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  tree_method: hist

shap:
  explainer: tree
  max_samples: 10000

models:
  decision_tree:
    enabled: true
    max_depths:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - null

  knn:
    enabled: false
    n_neighbors: 5

  logistic_regression:
    enabled: true
    max_iter: 1000

  rbf_svm:
    enabled: false
    C: 1.0
    gamma: scale

  xgboost:
    enabled: true
    booster: gbtree
    objective: auto
    eval_metric: auto
    num_boost_round: 100
    max_depth: 8
    eta: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: hist

metrics:
  - accuracy
  - balanced_accuracy
  - f1_macro
  - f1_weighted
  - roc_auc
  - pr_auc

output:
  directory: results/runs
  save_rankings: true
  save_selected_features: true